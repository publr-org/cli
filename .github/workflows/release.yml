name: Release

# Actions → Release → Run, choosing patch, minor or major. The next version is built and
# tested first; only then is its commit tagged and released, so a failed run leaves no tag
# or Release. The tag is merged into main afterwards. The Homebrew formula in
# publr-org/homebrew-tap is rewritten to the new release last.
#
# The workflow's own token pushes the tag and the merge: the release commit changes only
# version strings, never workflow files. TAP_TOKEN (push to publr-org/homebrew-tap) is
# optional; without it the formula step is skipped.
# The checkout of lib beside cli matches Publr's own workspace layout (`.path` dependencies);
# the compiler `plugin build` carries is built from lib/zig per target and cached
# (.github/actions/toolchain).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: What kind of release
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency: release

env:
  GH_TOKEN: ${{ github.token }}
  # The versions written on a release; build.zig.zon is the one read.
  VERSION_FILES: build.zig.zon src/main.zig

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { path: cli, fetch-depth: 0 }

      - name: The next version
        id: next
        working-directory: cli
        env: { BUMP: "${{ inputs.bump }}" }
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::release from main, not $GITHUB_REF"; exit 1
          fi
          current="$(sed -nE 's/^ *\.version = "([0-9]+\.[0-9]+\.[0-9]+)",$/\1/p' build.zig.zon)"
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            *)     version="$major.$minor.$((patch + 1))" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: cli }
      - uses: actions/checkout@v4
        with: { repository: publr-org/publr, path: publr }
      - uses: ./cli/.github/actions/toolchain
      - name: zig build test
        working-directory: cli
        run: zig build test -Dtoolchain-archive="$PUBLR_TOOLCHAIN_ARCHIVE"

  # Linux is cross-compiled against musl; each macOS binary is built on its own kind of CPU,
  # as Publr's are, since the compiler it carries is Zig built for that target.
  build:
    needs: [version, test]
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-linux-musl, file: publr-linux-x86_64 }
          - { runner: ubuntu-latest, target: aarch64-linux-musl, file: publr-linux-aarch64 }
          # A stated macOS, never `native`: a native build requires the build machine's own version.
          - { runner: macos-latest, target: aarch64-macos.15.0, file: publr-macos-aarch64 }
          - { runner: macos-15-intel, target: x86_64-macos.15.0, file: publr-macos-x86_64 }
    runs-on: ${{ matrix.runner }}
    env: { VERSION: "${{ needs.version.outputs.version }}" }
    steps:
      - uses: actions/checkout@v4
        with: { path: cli }
      - uses: ./cli/.github/actions/toolchain
        with: { target: "${{ matrix.target }}" }

      - name: Write the version
        working-directory: cli
        run: &write_version |
          sed -i.bak -E "s/^( *\.version = \")[0-9]+\.[0-9]+\.[0-9]+(\",)$/\1$VERSION\2/" build.zig.zon
          sed -i.bak -E "s/^(pub const version = \")[0-9]+\.[0-9]+\.[0-9]+(\";)$/\1$VERSION\2/" src/main.zig
          rm build.zig.zon.bak src/main.zig.bak
          grep -q "\"$VERSION\"" build.zig.zon && grep -q "\"$VERSION\"" src/main.zig

      - name: zig build
        working-directory: cli
        run: |
          zig build -Dtarget=${{ matrix.target }} -Dcpu=baseline -Doptimize=safe \
            -Dtoolchain-archive="$PUBLR_TOOLCHAIN_ARCHIVE" --prefix ../out
          cp ../out/bin/publr ../${{ matrix.file }}

      - name: Check it reports the version
        if: matrix.target != 'aarch64-linux-musl'
        run: test "$(./${{ matrix.file }} --version)" = "publr $VERSION"

      # Built for its own CPU, opening on macOS 15 and later: the version check above runs an
      # arm64 build happily on an Apple silicon runner, whatever its name says.
      - name: Its CPU and oldest macOS
        if: runner.os == 'macOS'
        run: |
          arch=$(case "${{ matrix.file }}" in *aarch64) echo arm64 ;; *) echo x86_64 ;; esac)
          file -b "./${{ matrix.file }}" | grep -q "$arch" || { echo "::error::not $arch"; exit 1; }
          minos=$(vtool -show-build "./${{ matrix.file }}" | awk '/minos/ { print $2 }')
          [ "$minos" = 15.0 ] || { echo "::error::needs macOS $minos, not 15.0"; exit 1; }

      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.file }}", path: "${{ matrix.file }}" }

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { path: cli, fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: "publr-*", merge-multiple: true }

      - name: Write the version
        working-directory: cli
        run: *write_version

      - name: Checksums
        working-directory: dist
        run: |
          cp ../cli/install.sh .
          chmod +x publr-*
          sha256sum publr-* install.sh > SHA256SUMS
          for file in publr-*; do sha256sum "$file" > "$file.sha256"; done
          cat SHA256SUMS

      - name: Commit the version and tag it
        working-directory: cli
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Release $TAG"
          git tag "$TAG"
          git push origin "$TAG"

      # The notes as React writes its own: the version and its date as the title, the beta line,
      # every change since the previous release with its commit, and the full changelog.
      - name: Release notes
        working-directory: cli
        env: { BETA: "The publr command is in beta: expect changes between releases." }
        run: |
          previous="$(git tag --list 'v*' --sort=-version:refname | grep -vx "$TAG" | head -1)"
          changes() {
            git log --reverse --no-merges --format='%h%x09%H%x09%s' "$previous..$TAG" -- "$@" |
              while IFS="$(printf '\t')" read -r short long subject; do
                case "$subject" in "Release v"*|"Desktop "[0-9]*|"Merge "*) continue ;; esac
                echo "- $subject ([$short]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$long))"
              done
          }
          {
            printf '%s\n\n' "$BETA"
            if [ -z "$previous" ]; then
              echo "First release."
            else
              printf '## All changes\n\n%s\n\n' "$(changes .)"
              echo "**Full changelog:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous...$TAG"
            fi
          } > "$RUNNER_TEMP/notes.md"
          echo "$VERSION ($(date -u '+%B %-d, %Y'))" > "$RUNNER_TEMP/title.txt"
          cat "$RUNNER_TEMP/title.txt" "$RUNNER_TEMP/notes.md"

      - name: Release
        working-directory: dist
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$(cat "$RUNNER_TEMP/title.txt")" --notes-file "$RUNNER_TEMP/notes.md" \
            publr-* install.sh SHA256SUMS

      - name: Merge the release into main
        working-directory: cli
        run: |
          git fetch -q origin main
          git checkout -q main
          git reset -q --hard origin/main
          git merge -q --no-edit "$TAG"
          git push -q origin main

      - name: Homebrew formula
        env: { TAP_TOKEN: "${{ secrets.TAP_TOKEN }}" }
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN is not set: no Homebrew formula yet"; exit 0
          fi
          git clone -q "https://x-access-token:$TAP_TOKEN@github.com/publr-org/homebrew-tap" tap
          mkdir -p tap/Formula
          sum() { cut -d' ' -f1 < "dist/$1.sha256"; }
          sed -e "s/@VERSION@/$VERSION/g" \
              -e "s/@MACOS_AARCH64@/$(sum publr-macos-aarch64)/" \
              -e "s/@MACOS_X86_64@/$(sum publr-macos-x86_64)/" \
              -e "s/@LINUX_AARCH64@/$(sum publr-linux-aarch64)/" \
              -e "s/@LINUX_X86_64@/$(sum publr-linux-x86_64)/" \
              cli/packaging/homebrew/publr.rb > tap/Formula/publr.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/publr.rb
          git commit -qm "publr $VERSION"
          git push -q origin HEAD

      # publr.dev/install.sh is served from the `publr-dev` R2 bucket (cloud/install).
      - name: Put the installer on publr.dev
        working-directory: dist
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp install.sh s3://publr-dev/install.sh \
            --endpoint-url https://7f3d3c3608d0f7085ffef31cff24b964.r2.cloudflarestorage.com \
            --content-type "text/plain; charset=utf-8"
